<!DOCTYPE html>
<!-- ============================================================
  obd_scanner.html
  --------------------------------------------------------------
  Interface de diagnostic OBD-II via pont serie ESP32/MCP2515
  (firmware obd_can_bridge.ino v1.1)
  Web Serial API : Chromium requis, aucune dependance externe.
  Auteur  : Eric Perret - assistance Claude
  Version : 1.0 - 2026-07-06
  --------------------------------------------------------------
  Protocole : commandes texte \n, cf. cartouche du firmware.
  Toutes les lectures sont declenchees par bouton (pas de polling).
============================================================ -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scanner OBD - Nemo 1.3 HDi</title>
<style>
  body{font-family:monospace;background:#1e1e1e;color:#ddd;margin:0;padding:16px}
  h1{font-size:18px;color:#7fb4e8;margin:0 0 12px}
  fieldset{border:1px solid #444;margin:0 0 12px;padding:10px}
  legend{color:#7fb4e8;padding:0 6px}
  button{background:#2d2d2d;color:#ddd;border:1px solid #666;padding:6px 14px;
         margin:2px;cursor:pointer;font-family:monospace;font-size:14px}
  button:hover{background:#3d3d3d}
  button:disabled{opacity:.4;cursor:default}
  #btnConn.on{border-color:#4c4;color:#4c4}
  #dtcOut{min-height:22px;padding:4px;color:#e8c07f}
  #egrOut{font-size:22px;color:#7fe89a;padding:4px}
  input[type=text]{background:#111;color:#ddd;border:1px solid #666;
         padding:5px;font-family:monospace;width:90px}
  #console{background:#111;border:1px solid #444;height:220px;overflow-y:auto;
         padding:6px;white-space:pre-wrap;font-size:12px}
  #console .tx{color:#7fb4e8}
  #console .rx{color:#9d9}
  .row{margin:4px 0}
</style>
</head>
<body>
<h1>Scanner OBD &mdash; Nemo 1.3 HDi</h1>

<fieldset>
  <legend>Connexion</legend>
  <button id="btnConn">Connecter</button>
  <span id="stat">deconnecte</span>
</fieldset>

<fieldset>
  <legend>Codes defaut</legend>
  <div class="row">
    <button id="btnDtc"   disabled>Lire DTC</button>
    <button id="btnPend"  disabled>DTC en attente</button>
    <button id="btnClear" disabled>Effacer</button>
  </div>
  <div id="dtcOut">&mdash;</div>
</fieldset>

<fieldset>
  <legend>Vanne EGR</legend>
  <button id="btnEgr" disabled>Lire EGR</button>
  <div id="egrOut">&mdash;</div>
</fieldset>

<fieldset>
  <legend>Requete PID / Sniffer</legend>
  <div class="row">
    mode <input type="text" id="pidMode" value="01">
    pid  <input type="text" id="pidNum"  value="0C">
    <button id="btnPid" disabled>Envoyer</button>
    <button id="btnSnif" disabled>Sniffer OFF</button>
  </div>
</fieldset>

<fieldset>
  <legend>Console</legend>
  <div id="console"></div>
  <div class="row">
    <input type="text" id="cmdLine" style="width:300px" placeholder="commande brute (PING?)">
    <button id="btnSend" disabled>Envoyer</button>
  </div>
</fieldset>

<script>
"use strict";

/* ---------- etat serie -------------------------------------- */
let port = null, writer = null, readAbort = null;
let rxBuf = "";
let snif = false;
/* resolveurs en attente : la prochaine ligne non-RX les sert   */
let pending = [];

const $ = id => document.getElementById(id);
const con = $("console");

function log(txt, cls){
  const d = document.createElement("div");
  d.textContent = txt;
  if(cls) d.className = cls;
  con.appendChild(d);
  con.scrollTop = con.scrollHeight;
  while(con.childNodes.length > 500) con.removeChild(con.firstChild);
}

/* ---------- emission ---------------------------------------- */
async function send(cmd){
  if(!writer) return;
  log("> " + cmd, "tx");
  await writer.write(new TextEncoder().encode(cmd + "\n"));
}

/* envoie une commande et attend la premiere ligne de reponse
   (les lignes sniffer "RX ..." ne comptent pas)                */
function query(cmd, timeoutMs){
  return new Promise(resolve => {
    const t = setTimeout(() => {
      pending = pending.filter(p => p !== entry);
      resolve(null);
    }, timeoutMs || 1500);
    const entry = line => { clearTimeout(t); resolve(line); };
    pending.push(entry);
    send(cmd);
  });
}

/* ---------- reception : decoupage en lignes ------------------ */
function onLine(line){
  log("< " + line, "rx");
  if(line.startsWith("RX ")) return;          /* flux sniffer   */
  const p = pending.shift();
  if(p) p(line);
}

async function readLoop(){
  const dec = new TextDecoder();
  readAbort = new AbortController();
  while(port && port.readable){
    const reader = port.readable.getReader();
    try{
      for(;;){
        const {value, done} = await reader.read();
        if(done) break;
        rxBuf += dec.decode(value);
        let i;
        while((i = rxBuf.indexOf("\n")) >= 0){
          const line = rxBuf.slice(0, i).replace(/\r$/, "");
          rxBuf = rxBuf.slice(i + 1);
          if(line.length) onLine(line);
        }
      }
    }catch(e){ /* deconnexion physique */ }
    finally{ reader.releaseLock(); }
    break;
  }
  disconnect();
}

/* ---------- connexion / deconnexion -------------------------- */
async function connect(){
  try{
    port = await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    writer = port.writable.getWriter();
    readLoop();
    setUi(true);
    const r = await query("PING?");
    $("stat").textContent = r ? "connecte (" + r + ")" : "connecte (pas de reponse firmware)";
    const m = await query("INIT?");
    if(m) log("Controleur CAN : " + m);
  }catch(e){
    $("stat").textContent = "echec : " + e.message;
  }
}

function disconnect(){
  try{ if(writer){ writer.releaseLock(); } }catch(e){}
  try{ if(port){ port.close(); } }catch(e){}
  port = null; writer = null;
  setUi(false);
  $("stat").textContent = "deconnecte";
}

function setUi(on){
  ["btnDtc","btnPend","btnClear","btnEgr","btnPid","btnSnif","btnSend"]
    .forEach(id => $(id).disabled = !on);
  $("btnConn").textContent = on ? "Deconnecter" : "Connecter";
  $("btnConn").className = on ? "on" : "";
}

/* ---------- actions ------------------------------------------ */
$("btnConn").onclick = () => port ? disconnect() : connect();

$("btnDtc").onclick = async () => {
  $("dtcOut").textContent = "...";
  const r = await query("DTC?");
  $("dtcOut").textContent = r || "pas de reponse";
};

$("btnPend").onclick = async () => {
  $("dtcOut").textContent = "...";
  const r = await query("PEND?");
  $("dtcOut").textContent = r ? "(attente) " + r : "pas de reponse";
};

$("btnClear").onclick = async () => {
  if(!confirm("Effacer les codes defaut ?")) return;
  const r = await query("CLEAR!");
  $("dtcOut").textContent = r || "pas de reponse";
};

$("btnEgr").onclick = async () => {
  $("egrOut").textContent = "...";
  const r = await query("EGR?");
  $("egrOut").textContent = r || "pas de reponse";
};

$("btnPid").onclick = async () => {
  const m = $("pidMode").value.trim(), p = $("pidNum").value.trim();
  if(!m || !p) return;
  await query("PID " + m + " " + p);
};

$("btnSnif").onclick = async () => {
  snif = !snif;
  await query(snif ? "SNIF ON" : "SNIF OFF");
  $("btnSnif").textContent = "Sniffer " + (snif ? "ON" : "OFF");
};

$("btnSend").onclick = () => {
  const c = $("cmdLine").value.trim();
  if(c){ send(c); $("cmdLine").value = ""; }
};
$("cmdLine").addEventListener("keydown", e => {
  if(e.key === "Enter") $("btnSend").onclick();
});

/* ---------- prerequis ---------------------------------------- */
if(!("serial" in navigator)){
  $("stat").textContent = "Web Serial indisponible (Chromium requis)";
  $("btnConn").disabled = true;
}
</script>
</body>
</html>
